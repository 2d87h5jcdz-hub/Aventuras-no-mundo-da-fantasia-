name: Build (Android APK + iOS IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # O Unity roda dentro de um container Linux. Usamos o mesmo caminho dentro do container
  # e no Mac, para que caminhos absolutos gravados no projeto Xcode continuem válidos.
  WORKSPACE_PATH: /Users/runner/ws

jobs:
  unity:
    name: Unity → ${{ matrix.targetPlatform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [Android, iOS]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Liberar espaço em disco (a imagem do Unity é grande)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Cache da pasta Library (deixa os próximos builds bem mais rápidos)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build com Unity (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Joaquim
          buildMethod: Joaquim.EditorTools.BuildScript.BuildFromCommandLine
          customParameters: -runNumber ${{ github.run_number }}
          versioning: None
          androidExportType: androidPackage
          dockerWorkspacePath: ${{ env.WORKSPACE_PATH }}

      - name: Publicar APK
        if: matrix.targetPlatform == 'Android'
        uses: actions/upload-artifact@v4
        with:
          name: Joaquim-Android-apk
          path: build/Android/*.apk
          if-no-files-found: error

      - name: Empacotar projeto Xcode (tar preserva as permissões dos scripts)
        if: matrix.targetPlatform == 'iOS'
        run: sudo tar -czf ios-xcode.tar.gz -C build/iOS .

      - name: Enviar projeto Xcode para o job do Mac
        if: matrix.targetPlatform == 'iOS'
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: ios-xcode.tar.gz
          retention-days: 1
          if-no-files-found: error

  ios-ipa:
    name: Xcode → IPA (sem assinatura)
    needs: unity
    runs-on: macos-latest
    steps:
      - name: Baixar projeto Xcode
        uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project

      - name: Extrair no mesmo caminho usado no build
        run: |
          mkdir -p "$WORKSPACE_PATH/build/iOS"
          tar -xzf ios-xcode.tar.gz -C "$WORKSPACE_PATH/build/iOS"
          ls "$WORKSPACE_PATH/build/iOS"

      - name: Compilar (archive sem assinatura)
        working-directory: ${{ env.WORKSPACE_PATH }}/build/iOS/Joaquim
        shell: bash # ativa pipefail: se o xcodebuild falhar, o passo falha
        run: |
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Joaquim.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive | tail -n 60
          test -d "$RUNNER_TEMP/Joaquim.xcarchive/Products/Applications"

      - name: Montar o .ipa
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R Joaquim.xcarchive/Products/Applications/*.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Joaquim.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/Joaquim.ipa"

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Joaquim-iOS-ipa
          path: Joaquim.ipa
          if-no-files-found: error
